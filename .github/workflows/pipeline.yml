name: "Terraform"

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  tf_version: 1.3.9
  tflint_version: v0.45.0

concurrency:
  group: ci-pipeline-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linters:
    name: "Terraform Linters"
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.tf_version }}
          terraform_wrapper: false

      - name: Test code with terraform fmt
        run: terraform fmt --recursive -check -diff

      - name: Test module with terraform validate
        run: |
          terraform init -backend=false -input=false -no-color
          terraform validate -no-color

      - name: Test examples with terraform validate
        run: |
          for dir in examples/*/; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false -no-color
            terraform -chdir="$dir" validate -no-color
            echo "::endgroup::"
          done

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: ${{ env.tflint_version }}

      - name: Test code with TFLint
        run: |
          tflint --init
          tflint --recursive -f compact

      - name: Test code with Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: /
          framework: terraform
          soft_fail: true
          quiet: true
          download_external_modules: false
